<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Zypher</title>
  <link rel="stylesheet" href="registro.css">
</head>
<body>

  <main class="register-page">
    <div class="register-wrapper">
      <div class="register-card">
        <div class="logo-wrap">
          <img src="img/logo-zypher.png" alt="Logo Zypher">
          <div class="logo-text">Zypher</div>
        </div>

        <h1>Iniciar sesión</h1>
        <p class="subtitle">Accede a tu cuenta de Zypher</p>

        <form action="login.php" method="POST" class="register-form">
          <div class="form-group">
            <label for="username">Usuario o correo</label>
            <input type="text" id="username" name="username" placeholder="Tu usuario o correo" required>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
          </div>

          <button type="submit" class="register-btn">Entrar</button>
        </form>

        <p class="bottom-text">
          ¿No tienes cuenta? <a href="/registro.html">Regístrate</a>
        </p>
      </div>
    </div>
  </main>

</body>
</html>
